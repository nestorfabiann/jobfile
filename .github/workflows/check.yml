name: Check code
# Runs on every push. Catches type errors and build failures before they reach the live site.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx next build
        continue-on-error: true  # type errors above are the gate; Vercel does the real build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
          SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder
